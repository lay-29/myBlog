<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的博客</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft Yahei", sans-serif;
      background: #f5f6f8;
      color: #2b2f33;
    }
    header {
      background: linear-gradient(120deg, #2b5876, #4e4376);
      color: #fff;
      padding: 24px 32px;
    }
    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    header p {
      margin: 0;
      opacity: 0.85;
    }
    .layout {
      display: grid;
      grid-template-columns: 260px 1fr 260px;
      gap: 20px;
      padding: 24px 32px 40px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    .profile img {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
    }
    .profile h2 {
      margin: 0 0 8px;
    }
    .tag {
      display: inline-block;
      background: #eef2f7;
      color: #4e5a65;
      padding: 4px 10px;
      border-radius: 999px;
      margin: 4px 6px 0 0;
      font-size: 12px;
    }
    .auth-section h3 {
      margin: 0 0 12px;
    }
    .auth-section input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #dde2e7;
    }
    .auth-section button {
      width: 100%;
      border: none;
      background: #4e4376;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .auth-section button + button {
      margin-top: 8px;
      background: #2b5876;
    }
    .auth-message {
      font-size: 13px;
      margin-top: 8px;
      color: #2b5876;
    }
    .blog {
      margin-bottom: 20px;
    }
    .blog h3 {
      margin: 0 0 6px;
    }
    .blog-meta {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 10px;
    }
    .comment {
      background: #f7f8fb;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 8px;
    }
    .comment-meta {
      font-size: 12px;
      color: #7a8594;
      margin-bottom: 4px;
    }
    .comment-form {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }
    .comment-form input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #dde2e7;
    }
    .comment-form button {
      background: #2b5876;
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .site-info ul {
      padding-left: 16px;
      margin: 8px 0 0;
    }
    @media (max-width: 1024px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="/components/ProfileCard.js"></script>
  <script src="/components/BlogList.js"></script>
  <script src="/components/SiteInfo.js"></script>
  <script src="/app.js"></script>
</body>
</html>
