<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>用户注册</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f7f9;
    }

    .container {
      width: 320px;
      margin: 100px auto;
      padding: 24px;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 16px;
      background: #409eff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #66b1ff;
    }

    .msg {
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>用户注册</h2>

  <input id="username" placeholder="用户名" />
  <input id="email" placeholder="邮箱" />
  <input id="password" type="password" placeholder="密码" />

 <h1>日志</h1>
 <output id="log">
 </output>


  <button onclick="register()">注册</button>

  <div class="msg" id="msg"></div>
</div>

<script>
async function register() {
  const username = document.getElementById("username").value.trim()
  const email = document.getElementById("email").value.trim()
  const password = document.getElementById("password").value

  const msgEl = document.getElementById("msg")
  msgEl.innerText = "提交中..."

  if (!username || !email || !password) {
    msgEl.innerText = "请填写完整信息"
    return
  }

  try {
    const resp = await fetch("/user/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username,
        email,
        password
      })
    })

    const data = await resp.json()

    if (data.code === 0) {
      msgEl.style.color = "green"
      msgEl.innerText = "注册成功：" + data.msg+data.data.id+data.data.name+data.data.email
    } else {
      msgEl.style.color = "red"
      msgEl.innerText = data.msg || "注册失败"
    }
  } catch (err) {
    msgEl.style.color = "red"
    msgEl.innerText = "请求失败，请检查服务器"
  }
}
</script>

</body>
</html>
